server {
    listen 80;
    server_name localhost;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # DSGVO: Keine IP-Adressen protokollieren
    access_log off;

    # PocketBase API — no IP forwarding (DSGVO: keine IP-Logs)
    location /api/ {
        proxy_pass http://pocketbase:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # PocketBase Admin UI
    location /_/ {
        proxy_pass http://pocketbase:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AP1-Trainer Subpfad (statisches Test-File — beweist Subpfad-Routing)
    location /ap1/ {
        alias /srv/sites/ap1/;
        try_files $uri $uri/ /ap1/index.html;
    }

    # Hub (statische Dateien aus dist/)
    location / {
        root /srv/sites/hub;
        try_files $uri $uri/ /index.html;
    }
}
