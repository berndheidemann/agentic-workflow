services:
  nginx:
    build:
      context: .
      dockerfile: nginx.Dockerfile
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lernplattform.rule=Host(`learn.szut.dev`)"
      - "traefik.http.routers.lernplattform.entrypoints=websecure"
      - "traefik.http.routers.lernplattform.tls.certresolver=letsencrypt"
      - "traefik.http.services.lernplattform.loadbalancer.server.port=80"
    networks:
      - default
      - traefik

  pocketbase:
    build:
      context: .
      dockerfile: pb.Dockerfile
    restart: unless-stopped
    volumes:
      - pb_data:/pb_data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pb_data:

networks:
  traefik:
    external: true
